name: tests

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{secrets.TEST_DB_ROOT_PASSWORD}}
          MYSQL_DATABASE: ${{secrets.TEST_DB_DATABASE}}
          MYSQL_USER: ${{secrets.TEST_DB_USER}}
          MYSQL_PASSWORD: ${{secrets.TEST_DB_PASSWORD}}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=$TEST_DB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Tests
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: ${{secrets.TEST_DB_DATABASE}}
          DB_USERNAME: ${{secrets.TEST_DB_USER}}
          DB_PASSWORD: ${{secrets.TEST_DB_PASSWORD}}

        run: ./vendor/bin/phpunit
